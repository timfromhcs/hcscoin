name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository metadata
        run: |
          test -f README.md
          test -f COPYING
          test -f CMakeLists.txt
          test -f .github/workflows/build.yml

      - name: Check CMake configure path
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libboost-dev \
            libevent-dev \
            libsqlite3-dev \
            ninja-build \
            pkg-config \
            python3
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DENABLE_WALLET=OFF \
            -DENABLE_IPC=OFF \
            -DWITH_ZMQ=OFF \
            -DBUILD_TESTS=OFF

      - name: Verify target names
        run: |
          cmake --build build-ci --target bitcoind bitcoin-cli --parallel 2
          test -x build-ci/bin/hcscoind
          test -x build-ci/bin/hcscoin-cli
          build-ci/bin/hcscoind --version
          build-ci/bin/hcscoin-cli --version
