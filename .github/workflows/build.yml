name: Build HCScoin

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-headless:
    name: Linux headless build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            cmake \
            git \
            libboost-dev \
            libevent-dev \
            libsqlite3-dev \
            ninja-build \
            pkg-config \
            python3

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DENABLE_WALLET=OFF \
            -DENABLE_IPC=OFF \
            -DWITH_ZMQ=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Smoke test binaries
        run: |
          test -x build/bin/hcscoind
          test -x build/bin/hcscoin-cli
          build/bin/hcscoind --version
          build/bin/hcscoin-cli --version

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          cp build/bin/hcscoin artifacts/ || true
          cp build/bin/hcscoind artifacts/
          cp build/bin/hcscoin-cli artifacts/
          cp build/bin/bitcoin-tx artifacts/hcscoin-tx || true
          cp build/bin/bitcoin-util artifacts/hcscoin-util || true
          tar -C artifacts -czf hcscoin-linux-x86_64.tar.gz .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hcscoin-linux-x86_64
          path: hcscoin-linux-x86_64.tar.gz

  docker:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hcscoin:ci .

      - name: Smoke test Docker image
        run: docker run --rm hcscoin:ci --version
