name: Build HCScoin Binaries

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install -y ninja
          choco install -y rustup.install
          choco install -y python3
          choco install -y vulkan-sdk
          choco install -y boost-msvc-14.2
          Write-Host "Dependencies installed"

      - name: Setup Rust toolchain
        run: rustup default stable

      - name: Build panta-sim
        run: |
          cd panta-sim
          cargo build --release

      - name: Build HCScoin Core
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF ..
          cmake --build . --config Release

      - name: Build quantum-miner
        run: |
          mkdir quantum-miner\build
          cd quantum-miner\build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release

      - name: Gather binaries
        run: |
          mkdir artifacts
          copy build\src\hcscoind.exe artifacts\
          copy build\src\hcscoin-cli.exe artifacts\
          copy quantum-miner\build\vulkan_miner.exe artifacts\
          copy panta-sim\target\release\panta_sim.dll artifacts\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hcscoin-windows-binaries
          path: artifacts/*

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 python3-pip git
          sudo apt-get install -y libvulkan-dev vulkan-tools libboost-all-dev
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env

      - name: Build panta-sim
        run: |
          source $HOME/.cargo/env
          cd panta-sim
          cargo build --release

      - name: Build HCScoin Core
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF ..
          cmake --build . --config Release

      - name: Build quantum-miner
        run: |
          mkdir quantum-miner/build
          cd quantum-miner/build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release

      - name: Gather binaries
        run: |
          mkdir artifacts
          cp build/src/hcscoind artifacts/
          cp build/src/hcscoin-cli artifacts/
          cp quantum-miner/build/vulkan_miner artifacts/
          cp panta-sim/target/release/libpanta_sim.so artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hcscoin-linux-binaries
          path: artifacts/*

