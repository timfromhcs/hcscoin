name: Build HCScoin Binaries

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install -y ninja
          choco install -y rustup.install
          choco install -y python3
          # Vulkan SDK (latest)
          $env:VULKAN_SDK = "C:\VulkanSDK\1.3.268.0"
          Invoke-WebRequest -Uri https://sdk.lunarg.com/sdk/download/1.3.268.0/windows/VulkanSDK-1.3.268.0-Installer.exe?Human=true -OutFile VulkanSDK.exe -UseBasicParsing
          .\VulkanSDK.exe /S
          Write-Host "Vulkan SDK installed at $env:VULKAN_SDK"
          # Boost libraries for Windows
          choco install -y boost-msvc-14.2
          Write-Host "Boost installed"

      - name: Setup Rust toolchain
        run: rustup default stable

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Gather binaries
        run: |
          mkdir artifacts
          copy build\src\hcscoind.exe artifacts\
          copy build\src\hcscoin-cli.exe artifacts\
          copy quantum-miner\build\quantum_miner.exe artifacts\
          copy panta-sim\target\release\panta_sim.dll artifacts\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hcscoin-windows-binaries
          path: artifacts/*

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 python3-pip git
          sudo apt-get install -y libvulkan-dev vulkan-tools libboost-all-dev
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Gather binaries
        run: |
          mkdir artifacts
          cp build/src/hcscoind artifacts/
          cp build/src/hcscoin-cli artifacts/
          cp quantum-miner/quantum_miner artifacts/
          cp panta-sim/target/release/libpanta_sim.so artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hcscoin-linux-binaries
          path: artifacts/*
