services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    image: hcscoin:local
    container_name: hcscoin-node
    restart: unless-stopped
    ports:
      - "28333:28333" # mainnet P2P
      - "127.0.0.1:28332:28332" # mainnet RPC, local only
    volumes:
      - hcscoin-data:/root/.hcscoin
    command:
      - -daemon=0
      - -printtoconsole
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=172.16.0.0/12

volumes:
  hcscoin-data:
